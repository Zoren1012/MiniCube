# Fabrique et publie l'installeur MiniCube quand une etiquette de version est poussee.
#
#   git tag v1.2.2
#   git push origin v1.2.2
#
# GitHub compile alors le projet sur une machine Windows et attache l'installeur a une
# publication. C'est la bonne facon de distribuer un executable : le depot ne contient
# que le code, et le binaire vit dans la section Releases, sans peser sur l'historique.

name: Publier une version

on:
  push:
    tags:
      - 'v*'
  # Permet aussi de lancer la fabrication a la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installeur Windows
    runs-on: windows-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Inno Setup
        # jpackage suffit pour l'executable autonome ; Inno Setup produit l'installeur.
        run: choco install innosetup --no-progress -y

      - name: Fabriquer les livrables
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\package.ps1

      - name: Verifier que l'installeur existe
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'MiniCube-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Aucun installeur produit dans dist/" }
          Write-Host "Installeur : $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) Mo)"

      - name: Archiver l'application autonome
        shell: pwsh
        run: |
          $version = (Select-String -Path 'src\main\java\com\minicube\launcher\core\Constants.java' `
                      -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path 'dist\MiniCube\*' -DestinationPath "dist\MiniCube-$version-windows.zip"

      - name: Publier
        # Cette etape ne s'execute que pour une etiquette : un lancement manuel se
        # contente de verifier que la fabrication passe.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-ChildItem dist -Filter '*.exe' | ForEach-Object { $_.FullName }) `
            (Get-ChildItem dist -Filter '*.zip' | ForEach-Object { $_.FullName }) `
            --title "MiniCube ${{ github.ref_name }}" `
            --notes "Installeur Windows. Aucun prerequis : le runtime Java est inclus.`n`nVoir CHANGELOG.md pour le detail des changements."

      - name: Conserver les livrables meme sans etiquette
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: MiniCube-windows
          path: |
            dist/*.exe
            dist/*.zip
