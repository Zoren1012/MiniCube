# Memoire allouee a Gradle. Loom deobfusque Minecraft au premier build : en dessous de
# 2 Go, l'operation echoue sur un manque de memoire.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Versions ciblees. Elles correspondent a l'installation Fabric que MiniCube pose par
# defaut : le mod se teste donc sans rien installer de plus.
# A verifier sur https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
loom_version=1.13.6

# Fabric API : les evenements de rendu du HUD en viennent.
fabric_api_version=0.141.6+1.21.11

# Identite du mod
mod_version=1.0.0
maven_group=fr.minicube
archives_base_name=minicube-hud
